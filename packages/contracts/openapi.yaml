    RecordExportSection:
      type: string
      enum: [appointments, consultations, care_plans, treatments, followups]
      description: 预约、问诊、已发布方案、治疗及修订、随访；不包含草稿或照片文件
    RecordExportInput:
      type: object
      additionalProperties: false
      required: [patientIds, sections, reason]
      properties:
        patientIds:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: {$ref: '#/components/schemas/EntityId'}
          description: 显式选择的患者编号，禁止空列表或隐式导出全部患者
        sections:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items: {$ref: '#/components/schemas/RecordExportSection'}
        dateFrom: {type: string, format: date, description: 与dateTo同时提供；上海日期起始日（含）}
        dateTo: {type: string, format: date, description: 上海日期结束日（含）；起止顺序有效，最多366个自然日。各类型按预约开始、实际问诊、方案发布、实际治疗、随访到期时间独立筛选；治疗修订随其治疗记录导出}
        masked: {type: boolean, default: true, description: 默认脱敏，去除姓名、电话、真实资料编号和全部自由文本；false仅主管允许}
        reason: {type: string, minLength: 1, maxLength: 200, description: 必填导出用途，去除前后空白后不能为空}
    RecordExportJob:
      type: object
      additionalProperties: false
      required: [id, employeeId, patientCount, sections, dateFrom, dateTo, masked, reason, status, createdAt, completedAt, expiresAt, sizeBytes, errorCode, downloadCount]
      properties:
        id: {$ref: '#/components/schemas/EntityId'}
        employeeId: {$ref: '#/components/schemas/EntityId'}
        patientCount: {type: integer, minimum: 1, maximum: 20}
        sections: {type: array, minItems: 1, maxItems: 5, uniqueItems: true, items: {$ref: '#/components/schemas/RecordExportSection'}}
        dateFrom: {type: string, pattern: '^$|^[0-9]{4}-[0-9]{2}-[0-9]{2}$', description: 上海起始日期，未限制时为空字符串}
        dateTo: {type: string, pattern: '^$|^[0-9]{4}-[0-9]{2}-[0-9]{2}$', description: 上海结束日期，未限制时为空字符串}
        masked: {type: boolean}
        reason: {type: string}
        status: {type: string, enum: [queued, processing, ready, failed, expired]}
        createdAt: {type: string, format: date-time}
        completedAt: {type: string, format: date-time, nullable: true}
        expiresAt: {type: string, format: date-time, nullable: true, description: 成功生成时间加24小时；未生成时为null}
        sizeBytes: {type: integer, format: int64, minimum: 0}
        errorCode: {type: string, description: 生成失败的机器可读原因，未失败时为空字符串}
        downloadCount: {type: integer, minimum: 0}
    RecordExportResult:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/RecordExportJob'}
    RecordExportPage:
      type: object
      additionalProperties: false
      required: [data, total, page, pageSize]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/RecordExportJob'}}
        total: {type: integer, minimum: 0}
        page: {type: integer, minimum: 1}
        pageSize: {type: integer, minimum: 1, maximum: 100}
