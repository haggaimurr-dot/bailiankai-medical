  /api/v1/admin/record-exports:
    post:
      operationId: createRecordExport
      summary: 创建异步档案导出任务
      description: 主管、医生和护理仅可导出当前有权查看的患者与资料；全量导出限主管。创建、生成和下载均重新校验在岗状态、角色、院区及人员归属。每位员工最多3个排队或生成中的任务。
      security: [{EmployeeBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecordExportInput'}
      responses:
        '202':
          description: 任务已持久化并排队，文件由后台异步生成
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordExportResult'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '429':
          description: 本员工已有3个待处理的导出任务
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        '503': {$ref: '#/components/responses/Error'}
    get:
      operationId: listRecordExports
      summary: 分页查看本人导出任务
      security: [{EmployeeBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: 仅返回当前员工本人创建的任务，按创建时间倒序
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordExportPage'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/admin/record-exports/{exportId}:
    get:
      operationId: getRecordExport
      summary: 查看本人导出任务状态
      security: [{EmployeeBearer: []}]
      parameters:
        - {name: exportId, in: path, required: true, schema: {$ref: '#/components/schemas/EntityId'}}
      responses:
        '200':
          description: 导出任务元数据，不包含患者明细或下载令牌
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecordExportResult'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/admin/record-exports/{exportId}/download:
    get:
      operationId: downloadRecordExport
      summary: 鉴权下载本人已生成的档案文件
      description: 文件生成完成后24小时有效。每次下载重新验证当前全部资料权限，权限丢失时整份拒绝；无公开地址，禁止缓存，记录成功与拒绝的审计事件。
      security: [{EmployeeBearer: []}]
      parameters:
        - {name: exportId, in: path, required: true, schema: {$ref: '#/components/schemas/EntityId'}}
      responses:
        '200':
          description: JSON档案附件，不含照片字节、照片编号或照片访问地址
          headers:
            Content-Disposition:
              description: attachment及服务端生成的JSON文件名
              schema: {type: string}
            Cache-Control:
              description: no-store
              schema: {type: string}
          content:
            application/json:
              schema: {type: string, format: binary}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409':
          description: 任务尚未完成或生成失败
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        '410':
          description: 文件已过期并删除，需重新创建任务
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/admin/record-exports/{exportId}/events:
    get:
      operationId: listRecordExportEvents
      summary: 查看本人导出任务审计
      security: [{EmployeeBearer: []}]
      parameters:
        - {name: exportId, in: path, required: true, schema: {$ref: '#/components/schemas/EntityId'}}
      responses:
        '200':
          description: 创建、生成、失败、成功或拒绝下载、到期事件；无患者正文
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/RecordExportEvent'}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/privacy-policy:
    get:
      operationId: getPrivacyPolicy
      responses:
        '200':
          description: 当前隐私说明版本（试点草案）
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/PrivacyPolicy'}
  /api/v1/me/privacy-consent:
    get:
      operationId: getPrivacyConsent
      security: [{PatientBearer: []}]
      responses:
        '200':
          description: 本人同意状态及追加式记录
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/PrivacyConsent'}
        '401': {$ref: '#/components/responses/Error'}
    post:
      operationId: setPrivacyConsent
      security: [{PatientBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [policyVersion, action]
              properties:
                policyVersion: {type: string}
                action: {type: string, enum: [accepted, revoked]}
      responses:
        '200':
          description: 已记录或幂等重放
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/PrivacyConsentEvent'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/admin/analytics:
    get:
      operationId: getOperationsAnalytics
      summary: 按医生、院区或每日统计授权院区的预约与随访队列
      description: v1口径。预约按计划就诊日期、随访按计划随访日期归入区间，指标反映查询时的状态。确认与独立到诊记录分开；无到诊记录的历史治疗不推定到诊。仅主管与运营可访问。
      security: [{EmployeeBearer: []}]
      parameters:
        - {name: dateFrom, in: query, required: true, schema: {type: string, format: date}, description: 北京时间起始日期（含）}
        - {name: dateTo, in: query, required: true, schema: {type: string, format: date}, description: 北京时间结束日期（含），最多366天}
        - {name: clinicId, in: query, schema: {$ref: '#/components/schemas/EntityId'}}
        - {name: doctorId, in: query, schema: {$ref: '#/components/schemas/EntityId'}}
        - {name: groupBy, in: query, schema: {type: string, enum: [doctor, clinic, day], default: doctor}}
      responses:
        '200':
          description: 同一查询快照的汇总、分组及授权筛选选项，不含患者明细
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/OperationsAnalyticsReport'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/admin/appointments/{appointmentId}/arrival:
    post:
      operationId: registerAppointmentArrival
      summary: 核实实际到院后登记到诊，可补录已治疗预约的实际到诊时间
      description: 已确认或已治疗预约才能登记。实际时间介于预约创建与当前时刻之间，有治疗记录时不得晚于治疗。相同时间重试幂等；已到诊预约不再允许患者取消。记录员工与登记时间，不修改预约确认/治疗状态。
      security: [{EmployeeBearer: []}]
      parameters:
        - {name: appointmentId, in: path, required: true, schema: {$ref: '#/components/schemas/EntityId'}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AppointmentArrival'}
      responses:
        '200':
          description: 已登记或相同时间的幂等重试
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppointmentResult'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
