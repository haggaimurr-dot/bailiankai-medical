        followupCount: {type: integer, format: int64, minimum: 0, description: 计划随访日期在区间内的随访任务}
        followupCompletedCount: {type: integer, format: int64, minimum: 0, description: 随访状态reviewed或handled，患者提交反馈不算完成}
        followupOverdueCount: {type: integer, format: int64, minimum: 0, description: 计划时间已过且仍pending的任务，表示逾期未提交反馈}
        alertCount: {type: integer, format: int64, minimum: 0, description: 状态alert或handled的异常随访任务}
        alertHandledCount: {type: integer, format: int64, minimum: 0, description: 状态handled的异常随访任务}
        pendingAlertCount: {type: integer, format: int64, minimum: 0, description: 状态alert的待处理异常任务}
