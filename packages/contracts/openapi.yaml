        followupCompletionRate: {type: number, nullable: true, minimum: 0, maximum: 100, description: 完成随访/随访任务*100，分母0时null}
        alertHandlingRate: {type: number, nullable: true, minimum: 0, maximum: 100, description: 已处理异常/异常任务*100，分母0时null}
