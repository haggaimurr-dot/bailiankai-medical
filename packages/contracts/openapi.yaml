      description: 患者端查看提醒偏好。
      security: [{PatientBearer: []}]
      responses:
        '200':
          description: 偏好
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: object}
        default: {$ref: '#/components/responses/Error'}
    put:
      operationId: updateNotificationPreferences
      description: 患者端更新提醒偏好。
      security: [{PatientBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [appointmentReminder, followupReminder, careReminder, leadHours]
              properties:
                appointmentReminder: {type: boolean}
                followupReminder: {type: boolean}
                careReminder: {type: boolean}
                leadHours: {type: integer}
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: object}
        default: {$ref: '#/components/responses/Error'}
