  /api/v1/me/messages:
    get:
      operationId: listPatientMessages
      description: 患者站内消息，按创建时间倒序；返回未读数。
      security: [{PatientBearer: []}]
      parameters:
        - name: page
          in: query
          schema: {type: integer, minimum: 1, maximum: 1000000, default: 1}
        - name: pageSize
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: 站内消息列表
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/PatientMessageList'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/me/messages/unread-count:
    get:
      operationId: getPatientMessageUnreadCount
      description: 未读站内消息数。
      security: [{PatientBearer: []}]
      responses:
        '200':
          description: 未读数
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [unreadCount]
                    properties:
                      unreadCount: {type: integer}
        '401': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/me/messages/{messageId}/read:
    post:
      operationId: markPatientMessageRead
      description: 将一条站内消息标为已读。
      security: [{PatientBearer: []}]
      parameters:
        - name: messageId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: 已标为已读
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageSaved'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
