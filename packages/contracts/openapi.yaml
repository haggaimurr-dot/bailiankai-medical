components:
  securitySchemes:
    PatientBearer:
      type: http
      scheme: bearer
      description: 独立患者的随机开发会话，服务端只存摘要；过期返回401，不接受前端指定患者ID。
    EmployeeBearer:
      type: http
      scheme: bearer
      description: 员工账号登录取得的限时随机会话；服务端只保存令牌摘要。
  parameters:
    AppointmentId:
      name: appointmentId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/EntityId'}
    AppointmentStatus:
      name: status
      in: query
      schema: {$ref: '#/components/schemas/AppointmentStatus'}
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 1, maximum: 100000, default: 1, format: int32}
    PageSize:
      name: pageSize
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20, format: int32}
    ClinicId:
      name: clinicId
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[A-Za-z0-9_-]+$'
  responses:
    Error:
      description: 请求失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    SupportTicket: {"type": "object", "additionalProperties": false, "properties": {"id": {"type": "string"}, "patientId": {"type": "string"}, "clinicId": {"type": "string"}, "subject": {"type": "string"}, "category": {"type": "string"}, "assigneeId": {"type": "string"}, "status": {"type": "string", "enum": ["open", "in_progress", "waiting_patient", "resolved", "closed"]}, "dueAt": {"type": "string", "format": "date-time", "nullable": true}, "version": {"type": "integer"}, "createdAt": {"type": "string", "format": "date-time"}, "updatedAt": {"type": "string", "format": "date-time"}, "rating": {"type": "integer", "minimum": 0, "maximum": 5}, "ratingComment": {"type": "string", "maxLength": 500}}, "required": ["id", "patientId", "clinicId", "subject", "category", "assigneeId", "status", "dueAt", "version", "createdAt", "updatedAt"]}
    SupportEvent: {"type": "object", "additionalProperties": false, "properties": {"id": {"type": "string"}, "ticketId": {"type": "string"}, "kind": {"type": "string"}, "actorType": {"type": "string"}, "content": {"type": "string"}, "internal": {"type": "boolean"}, "createdAt": {"type": "string", "format": "date-time"}, "attachments": {"type": "array", "items": {"$ref": "#/components/schemas/SupportAttachment"}}}, "required": ["id", "ticketId", "kind", "actorType", "content", "internal", "createdAt"]}
