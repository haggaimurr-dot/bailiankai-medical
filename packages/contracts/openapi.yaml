        confirmedAppointmentCount: {type: integer, format: int64, minimum: 0, description: 曾确认的预约，含后来取消的预约；根据确认事件去重，历史confirmed/completed状态兜底}
        arrivedAppointmentCount: {type: integer, format: int64, minimum: 0, description: 具有独立arrivedAt记录的预约}
