      description: 主管查看到诊指引配置；到诊登记后自动推送给患者的面诊流程指引文案。
      security: [{EmployeeBearer: []}]
      parameters:
        - {name: clinicId, in: query, required: true, schema: {type: string, pattern: '^[A-Za-z0-9_-]+$'}}
      responses:
        '200':
          description: 到诊指引配置
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ArrivalGuidanceSetting'
        '404': {$ref: '#/components/responses/Error'}
    put:
      operationId: saveArrivalGuidance
      description: 主管保存到诊指引配置。
      security: [{EmployeeBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ArrivalGuidanceInput'}
      responses:
        '200':
          description: 已保存的到诊指引配置
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ArrivalGuidanceSetting'
  /api/v1/admin/holidays:
    get:
      operationId: listHolidays
      description: 主管查看节假日列表；排班批量生成与模板套用时节假日当天自动跳过。
      security: [{EmployeeBearer: []}]
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'}}
        - {name: to, in: query, required: true, schema: {type: string, format: date, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'}}
      responses:
        '200':
          description: 节假日列表
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Holiday'}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      operationId: createHoliday
      description: 主管新增节假日；当天排班生成自动跳过，已有排班不受影响。
      security: [{EmployeeBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HolidayInput'}
      responses:
        '201':
          description: 节假日已设置
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/Holiday'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/admin/holidays/{date}:
    delete:
      operationId: deleteHoliday
      description: 主管删除节假日。
      security: [{EmployeeBearer: []}]
      parameters:
        - {name: date, in: path, required: true, schema: {type: string, format: date, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'}}
      responses:
        '204': {description: 节假日已删除}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/admin/slots/suspend:
    post:
      operationId: suspendSlots
      description: 主管按所选时段及版本整批停诊，填写原因；关闭时段，保留既有预约及名额，不自动取消或改约。
      security: [{EmployeeBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SlotSuspension'}
      responses:
        '200':
          description: 整批停诊成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SlotList'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/admin/slots/{slotId}:
    patch:
      operationId: updateSlot
      description: 开发环境演示操作。version 防止覆盖并发修改；容量不能少于已占用数量。
      security:
        - EmployeeBearer: []
      parameters:
        - name: slotId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
            pattern: '^[A-Za-z0-9_-]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlotUpdate'
      responses:
        '200':
          description: 已保存排班，版本递增
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotResult'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/dev/patient-sessions:
    post:
      operationId: createDevPatientSession
      description: 仅开发环境创建独立演示患者和7天会话；不能指定其他患者身份。
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '201':
          description: 新建独立演示身份
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PatientSessionResult'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/patient/session:
    post:
      operationId: loginPatient
      description: 服务端验证 wx.login 临时 code，按 appid/openid 恢复稳定患者身份，不接受客户端患者ID或手机号作为身份凭据。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PatientLogin'}
      responses:
        '200':
          description: 同一微信账号恢复同一患者，签发独立7天会话
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PatientSessionResult'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/me/profile:
    put:
      operationId: updatePatientProfile
      security: [{PatientBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PatientProfileUpdate'}
      responses:
        '200':
          description: 当前患者资料，修改不影响历史预约联系人
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PatientIdentityResult'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/me/phone:
    post:
      operationId: authorizePatientPhone
      description: 使用 getPhoneNumber 临时 code 验证账号手机号；此授权独立于诊疗照片授权。
      security: [{PatientBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PatientPhoneAuthorization'}
      responses:
        '200':
          description: 已验证的账号手机号和授权状态
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PatientIdentityResult'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/me/phone/revoke:
    post:
      operationId: revokePatientPhone
      security: [{PatientBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PatientVersionAction'}
      responses:
        '200':
          description: 撤回账号手机号授权并清除账号手机号，历史预约联系人保持原值
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PatientIdentityResult'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/me/logout:
    post:
      operationId: logoutPatient
      security: [{PatientBearer: []}]
      responses:
        '200':
          description: 当前设备会话已注销，其他设备会话继续有效
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: boolean}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/me:
    get:
      operationId: getMe
      security: [{PatientBearer: []}]
      responses:
        '200':
          description: 当前会话的患者身份
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PatientIdentityResult'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/me/appointments:
    get:
      operationId: listMyAppointments
      security: [{PatientBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/AppointmentStatus'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: 仅当前患者预约，按创建时间倒序
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppointmentPage'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createAppointment
      description: 普通申请即占一个名额；waitlist=true登记不占号候补。同一患者同一时段只能有一条候补、待确认或已确认预约；同一请求键重复提交返回同一预约。
      security: [{PatientBearer: []}]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {$ref: '#/components/schemas/RequestKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AppointmentCreate'}
      responses:
        '201':
          description: 新建待确认预约
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppointmentResult'}
        '200':
          description: 幂等重放，返回已有预约的当前状态
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppointmentResult'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/me/appointments/by-request/{requestKey}:
    get:
      operationId: getAppointmentByRequest
      description: 提交超时时查询结果。404不表示原提交已终止；重试须使用原请求键和相同内容。
      security: [{PatientBearer: []}]
      parameters:
        - name: requestKey
          in: path
          required: true
          schema: {$ref: '#/components/schemas/RequestKey'}
      responses:
        '200':
          description: 此患者请求对应的预约
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppointmentResult'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/me/appointments/{appointmentId}:
    get:
      operationId: getMyAppointment
      security: [{PatientBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/AppointmentId'}
      responses:
        '200':
          description: 本人预约详情；其他患者的预约返回404
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppointmentResult'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/me/appointments/{appointmentId}/reschedule:
    post:
      operationId: rescheduleMyAppointment
      description: 同医生同院区原子改期，成功后重新待确认；候补提交原时段可主动申请空位。原Idempotency-Key及原内容重试不会重复换号。
      security: [{PatientBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/AppointmentId'}
        - name: Idempotency-Key
          in: header
          required: true
          schema: {$ref: '#/components/schemas/RequestKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AppointmentReschedule'}
      responses:
        '200':
          description: 最新预约结果
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppointmentResult'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/me/appointments/{appointmentId}/timeline:
    get:
      operationId: getMyAppointmentTimeline
      security: [{PatientBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/AppointmentId'}
      responses:
        '200':
          description: 本人预约的服务端操作历史，按时间正序，不暴露操作人员标识
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppointmentTimelineResult'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/me/appointments/{appointmentId}/cancel:
    post:
      operationId: cancelMyAppointment
      security: [{PatientBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/AppointmentId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AppointmentCancel'}
      responses:
        '200':
          description: 就诊开始前取消，释放一个名额
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppointmentResult'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/me/waitlist:
    get:
      operationId: listMyWaitlist
      security: [{PatientBearer: []}]
      responses:
        '200':
          description: 本人候补中的预约及其限时确认 offer（无 offer 时 offer 为 null）
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WaitlistListResult'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/me/appointments/{appointmentId}/waitlist-confirm:
    post:
      operationId: confirmWaitlistOffer
      description: 在限时确认 offer 有效期内确认，候补转为待确认；超时返回 409 且空位自动顺延给下一位候补者。
      security: [{PatientBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/AppointmentId'}
      responses:
        '200':
          description: 已转为待确认
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppointmentResult'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/admin/waitlist:
    get:
      operationId: listWaitlistQueue
      security: [{EmployeeBearer: []}]
      parameters:
        - name: slotId
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: 指定时段的候补队列（按登记时间正序）及其限时确认 offer
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WaitlistListResult'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: sweepWaitlist
      description: 结算过期 offer 并向有空位的时段顺延；返回本次过期与新 offer 数量。
      security: [{EmployeeBearer: []}]
      responses:
        '200':
          description: 结算结果
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WaitlistSweepResult'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/doctors/{doctorId}/reviews:
    get:
      operationId: listDoctorReviews
      description: 仅返回已审核通过的患者评价，署名已脱敏。
      parameters:
        - name: doctorId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: 已审核通过的评价（最新在前）
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/DoctorReviewPublic'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/me/doctors/{doctorId}/reviews:
    post:
      operationId: createDoctorReview
      description: 仅已治疗（treatments 有记录）患者可评，每单一次；提交后待审核，不立即公开。
      security: [{PatientBearer: []}]
      parameters:
        - name: doctorId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PatientReviewInput'}
      responses:
        '200':
          description: 已提交，待审核
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/DoctorReview'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/me/doctors/{doctorId}/reviewable:
    get:
      operationId: listReviewableAppointments
      description: 本人与该医生之间已有治疗记录且尚未评价的预约。
      security: [{PatientBearer: []}]
      parameters:
        - name: doctorId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: 可评价预约（就诊时间倒序）
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/ReviewableAppointment'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/me/reviews:
    get:
      operationId: listMyReviews
      security: [{PatientBearer: []}]
      parameters:
        - name: doctorId
          in: query
          schema: {type: string}
      responses:
        '200':
          description: 本人提交的评价（含待审核与已驳回）
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/DoctorReview'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/admin/reviews:
    get:
      operationId: listAdminReviews
      security: [{EmployeeBearer: []}]
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [pending, approved, rejected]}
      responses:
        '200':
          description: 评价审核队列（最新在前）
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/DoctorReview'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/admin/reviews/{reviewId}/review:
    post:
      operationId: decideDoctorReview
      security: [{EmployeeBearer: []}]
      parameters:
        - name: reviewId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DoctorReviewDecision'}
      responses:
        '200':
          description: 审核结果
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/DoctorReview'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/me/appointments/{appointmentId}/photo-consent:
    get:
      operationId: getPhotoConsent
      security: [{PatientBearer: []}]
      parameters: [{$ref: '#/components/parameters/AppointmentId'}]
      responses:
        '200':
          description: 当前患者在此预约下的照片诊疗用途授权状态
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PhotoConsentResult'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: setPhotoConsent
      security: [{PatientBearer: []}]
      parameters: [{$ref: '#/components/parameters/AppointmentId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PhotoConsentUpdate'}
      responses:
        '200':
          description: 已记录授权或撤回
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PhotoConsentResult'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/me/appointments/{appointmentId}/photos:
    get:
      operationId: listMyCarePhotos
      security: [{PatientBearer: []}]
      parameters: [{$ref: '#/components/parameters/AppointmentId'}]
      responses:
        '200':
          description: 仅当前患者在此预约下的照片
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CarePhotoList'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/me/appointments/{appointmentId}/photos/{angle}:
    post:
      operationId: uploadCarePhoto
      security: [{PatientBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/AppointmentId'}
        - name: angle
          in: path
          required: true
          schema: {type: string, enum: [front, left, right]}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '200':
          description: 此角度照片已保存，重传会替换当前照片
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CarePhotoResult'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/me/photos/{photoId}/content:
    get:
      operationId: getMyCarePhotoContent
      security: [{PatientBearer: []}]
      parameters:
        - {name: photoId, in: path, required: true, schema: {$ref: '#/components/schemas/EntityId'}}
      responses:
        '200': {description: 已鑑權的照片檔案, content: {image/jpeg: {schema: {type: string, format: binary}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/me/appointments/{appointmentId}/care-plan:
    get:
      operationId: getMyCarePlan
      security: [{PatientBearer: []}]
      parameters: [{$ref: '#/components/parameters/AppointmentId'}]
      responses:
        '200':
          description: 已發布的方案版本，不包含草稿
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CarePlanVersionList'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/admin/care-plan-templates:
    get:
      operationId: listCarePlanTemplates
      description: 主管和医护读取本人保存的方案模板。
      security: [{EmployeeBearer: []}]
      responses:
        '200':
          description: 个人模板
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/CarePlanTemplate'}}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createCarePlanTemplate
      security: [{EmployeeBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, content]
              properties:
                name: {type: string, minLength: 1, maxLength: 80}
                content: {$ref: '#/components/schemas/CarePlanContent'}
